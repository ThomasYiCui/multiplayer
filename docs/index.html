<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>2D Multiplayer Adventure</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <div id="lobbyScreen" class="screen">
        <div class="card">
            <h1>Multiplayer Test</h1>
            <p class="subtitle">Play with friends online</p>

            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="playerNameInput" placeholder="Enter your nickname..." maxlength="12">
            </div>

            <div class="action-buttons" style="display: flex; flex-direction: column; gap: 8px;">
                <button id="createBtn" class="btn primary">Create New Room</button>
                <button id="offlineBtn" class="btn secondary" style="background: #334155; border: 1px solid #475569;">🕹️ Play Offline (Solo Dev Mode)</button>
            </div>

            <div class="divider"><span>OR JOIN WITH CODE</span></div>

            <div class="join-group">
                <input type="text" id="roomCodeInput" placeholder="4-Letter Code (e.g. ABCD)" maxlength="4">
                <button id="joinBtn" class="btn secondary">Join</button>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen" style="display: none;">
        <div class="hud">
            <div>Room Code: <strong id="displayRoomCode" class="room-tag">----</strong> (Share with friends)</div>
            <div>Controls: <strong>WASD / Arrow Keys</strong></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script src="network.js"></script>
    <script src="game.js"></script>
</body>

</html>
