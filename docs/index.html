<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>2D Multiplayer Adventure</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <div id="lobbyScreen" class="screen">
        <div class="card">
            <h1>Multiplayer Test</h1>
            <p class="subtitle">Play with friends online</p>

            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="playerNameInput" placeholder="Enter your nickname..." maxlength="12">
            </div>

            <div class="action-buttons" style="display: flex; flex-direction: column; gap: 8px;">
                <button id="createBtn" class="btn primary">Create New Room</button>
                <button id="offlineBtn" class="btn secondary"
                    style="background: #334155; border: 1px solid #475569;">🕹️ Play Offline (Solo Dev Mode)</button>
            </div>

            <div class="divider"><span>OR JOIN WITH CODE</span></div>

            <div class="join-group">
                <input type="text" id="roomCodeInput" placeholder="4-Letter Code (e.g. ABCD)" maxlength="4">
                <button id="joinBtn" class="btn secondary">Join</button>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen" style="display: none; position: relative;">
        <div id="roomCodeBadge" style="position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 8px; border: 1px solid #334155; font-size: 14px; color: #94a3b8; pointer-events: none; z-index: 10;">
            Room Code: <strong id="displayRoomCode" style="color: #38bdf8; font-size: 16px; letter-spacing: 1px;">----</strong>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="network.js?v=3"></script>
    <script src="player.js?v=3"></script>
    <script src="game.js?v=3"></script>
</body>

</html>
