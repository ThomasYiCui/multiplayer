<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>2D Multiplayer RPG Adventure</title>
    <link rel="stylesheet" href="style.css?v=5">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <!-- SCREEN 1: LOGIN & REGISTRATION -->
    <div id="authScreen" class="screen">
        <div class="card auth-card">
            <h1>Realm Chronicles</h1>
            <p class="subtitle">Multiplayer 2D Online RPG</p>

            <!-- Auth Switcher Tabs -->
            <div class="auth-tabs">
                <button id="tabLogin" class="tab-btn active">Login</button>
                <button id="tabRegister" class="tab-btn">Register</button>
            </div>

            <div id="authError" class="auth-error" style="display: none;"></div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="authUsername" placeholder="Enter username..." maxlength="16" autocomplete="username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="Enter password..." maxlength="32" autocomplete="current-password">
            </div>

            <button id="authSubmitBtn" class="btn primary" style="margin-top: 8px;">Login</button>

            <div class="divider"><span>OR</span></div>

            <button id="offlineBtn" class="btn secondary">Play Offline (Solo Dev Mode)</button>
        </div>
    </div>

    <!-- SCREEN 2: WORLD SELECTION (3 WORLDS, MAX 50 PLAYERS) -->
    <div id="worldScreen" class="screen" style="display: none;">
        <div class="world-container">
            <header class="world-header">
                <div>
                    <h2>Choose Your Realm</h2>
                    <p class="subtitle" style="margin-bottom: 0;">Select a persistent world to enter (Max 50 players each)</p>
                </div>
                <div class="user-pill">
                    <div class="user-pill-info">
                        <span id="headerUsername" class="user-pill-name">Adventurer</span>
                        <span id="headerUserLevel" class="user-pill-lvl">Level 1</span>
                        <span id="headerUserGold" class="user-pill-gold">0 Gold</span>
                    </div>
                    <button id="logoutBtn" class="logout-btn">Log Out</button>
                </div>
            </header>

            <div class="worlds-grid" id="worldsGrid">
                <!-- World Cards rendered by JavaScript -->
            </div>
        </div>
    </div>

    <!-- SCREEN 3: ACTIVE GAME CANVAS -->
    <div id="gameScreen" class="screen" style="display: none; position: relative;">
        <!-- Top RPG HUD -->
        <div id="hudBar" class="game-hud">
            <div class="hud-left">
                <span class="realm-badge" id="hudWorldName">Aethelgard</span>
                <span class="hud-stat" id="hudPlayerLevel">Lv. 1</span>
                <div class="hud-hp-wrap">
                    <span class="hud-hp-label">HP</span>
                    <div class="hud-hp-bg"><div class="hud-hp-fill" id="hudHpFill" style="width: 100%;"></div></div>
                    <span class="hud-hp-text" id="hudHpText">100 / 100</span>
                </div>
                <span class="hud-gold" id="hudGoldText">0 Gold</span>
            </div>
            <button id="leaveWorldBtn" class="leave-btn">Leave Realm</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="network.js?v=5"></script>
    <script src="player.js?v=5"></script>
    <script src="game.js?v=5"></script>
</body>

</html>
