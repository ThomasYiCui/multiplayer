<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>2D Multiplayer Adventure</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <div id="lobbyScreen" class="screen">
        <div class="card" style="width: 440px;">
            <h1>Multiplayer Game</h1>
            <p class="subtitle">Join a live game or create your own</p>

            <div class="form-group">
                <label>Your Nickname</label>
                <input type="text" id="playerNameInput" placeholder="Enter your nickname..." maxlength="14">
            </div>

            <div class="action-buttons" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
                <button id="quickPlayBtn" class="btn primary" style="font-size: 15px; font-weight: bold; background: #0284c7;">Quick Play (Join World)</button>
                
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="lobbyNameInput" placeholder="Lobby Name (optional)..." style="flex: 1;">
                    <button id="createLobbyBtn" class="btn secondary" style="white-space: nowrap; width: auto; background: #059669;">Host Lobby</button>
                </div>

                <button id="offlineBtn" class="btn secondary" style="background: #334155; border: 1px solid #475569;">Play Offline (Solo Mode)</button>
            </div>

            <div class="divider"><span>LIVE ACTIVE LOBBIES</span></div>

            <div id="lobbiesContainer" style="display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; text-align: left;">
                <div style="text-align: center; color: #64748b; font-size: 13px; padding: 12px;">Connecting to lobby list...</div>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen" style="display: none; position: relative;">
        <div id="roomCodeBadge" style="position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 8px; border: 1px solid #334155; font-size: 14px; color: #94a3b8; display: flex; align-items: center; gap: 12px; z-index: 10;">
            <div>Lobby: <strong id="displayRoomCode" style="color: #38bdf8; font-size: 15px;">----</strong></div>
            <button id="leaveBtn" style="background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">Leave</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="network.js?v=4"></script>
    <script src="player.js?v=4"></script>
    <script src="game.js?v=4"></script>
</body>

</html>
