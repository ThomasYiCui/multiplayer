<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>2D Multiplayer RPG Adventure</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css?v=5">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <!-- SCREEN 1: LOGIN & REGISTRATION -->
    <div id="authScreen" class="screen">
        <div class="card auth-card">
            <h1>ThimiTuah's Title Card</h1>
            <p class="subtitle">Pls gimmme money for servers<br></p>

            <!-- Auth Switcher Tabs -->
            <div class="auth-tabs">
                <button id="tabLogin" class="tab-btn active">Login</button>
                <button id="tabRegister" class="tab-btn">Register</button>
            </div>

            <div id="authError" class="auth-error" style="display: none;"></div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="authUsername" placeholder="Enter username..." maxlength="16"
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="Enter password..." maxlength="32"
                    autocomplete="current-password">
            </div>

            <button id="authSubmitBtn" class="btn primary" style="margin-top: 8px;">Login</button>

            <div class="divider"><span>OR</span></div>

            <button id="offlineBtn" class="btn secondary">Play Offline (Solo Dev Mode)</button>
        </div>
    </div>

    <!-- SCREEN 2: WORLD SELECTION (3 WORLDS, MAX 50 PLAYERS) -->
    <div id="worldScreen" class="screen" style="display: none;">
        <div class="world-container">
            <header class="world-header">
                <div>
                    <h2>Server Selection</h2>
                    <p class="subtitle" style="margin-bottom: 0;">Select a server</p>
                </div>
                <div class="user-pill">
                    <div class="user-pill-info">
                        <span id="headerUsername" class="user-pill-name">Adventurer</span>
                        <span id="headerUserLevel" class="user-pill-lvl">Level 1</span>
                        <span id="headerUserGold" class="user-pill-gold">0 Gold</span>
                    </div>
                    <button id="logoutBtn" class="logout-btn">Log Out</button>
                </div>
            </header>

            <div class="worlds-grid" id="worldsGrid">
                <!-- World Cards rendered by JavaScript -->
            </div>
        </div>
    </div>

    <!-- SCREEN 3: ACTIVE GAME CANVAS -->
    <div id="gameScreen" class="screen" style="display: none; position: relative;">
        <!-- BOTTOM-RIGHT PLAYER STATUS HUD -->
        <div id="playerStatusHud" class="bottom-player-hud glass-panel">
            <div class="player-hud-header">
                <div class="player-hud-name-wrap">
                    <span id="hudPlayerLevel" class="hud-level-pill">Lv. 1</span>
                    <span id="hudPlayerName" class="hud-player-name">Adventurer</span>
                </div>
                <div class="player-hud-meta">
                    <span id="hudGoldText" class="hud-gold-text">0 Gold</span>
                    <span id="hudPing" class="hud-ping-pill">-- ms</span>
                </div>
            </div>

            <!-- Health Bar -->
            <div class="stat-bar-group">
                <div class="stat-bar-header">
                    <span class="stat-label stat-label-hp">Health</span>
                    <span id="hudHpText" class="stat-value">100 / 100</span>
                </div>
                <div class="stat-bar-track">
                    <div id="hudHpFill" class="stat-bar-fill stat-fill-hp" style="width: 100%;"></div>
                </div>
            </div>

            <!-- Stamina Bar -->
            <div class="stat-bar-group">
                <div class="stat-bar-header">
                    <span class="stat-label stat-label-stamina">Stamina</span>
                    <span id="hudStaminaText" class="stat-value">100 / 100</span>
                </div>
                <div class="stat-bar-track">
                    <div id="hudStaminaFill" class="stat-bar-fill stat-fill-stamina" style="width: 100%;"></div>
                </div>
            </div>

            <!-- EXP Bar -->
            <div class="stat-bar-group">
                <div class="stat-bar-header">
                    <span class="stat-label stat-label-exp">EXP</span>
                    <span id="hudExpText" class="stat-value">0 / 100 XP</span>
                </div>
                <div class="stat-bar-track">
                    <div id="hudExpFill" class="stat-bar-fill stat-fill-exp" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <!-- ESCAPE MENU MODAL OVERLAY -->
        <div id="escapeMenu" class="escape-overlay" style="display: none;">
            <div class="escape-card glass-panel">
                <h2 class="escape-title">Game Menu</h2>
                <div class="escape-server-box">
                    <span class="escape-server-label">Current Realm</span>
                    <span id="escapeServerName" class="escape-server-name">Aethelgard</span>
                </div>
                <div class="escape-btn-group">
                    <button id="escapeResumeBtn" class="escape-btn resume-btn">Resume Game [ESC]</button>
                    <button id="escapeHitboxBtn" class="escape-btn toggle-btn">Hitboxes: ON [H]</button>
                    <button id="leaveWorldBtn" class="escape-btn leave-btn">Leave Server</button>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="particles.js?v=21"></script>
    <script src="damage_counter.js?v=21"></script>
    <script src="character.js?v=21"></script>
    <script src="wall.js?v=21"></script>
    <script src="weapon.js?v=21"></script>
    <script src="enemy.js?v=21"></script>
    <script src="Enemies/slime.js?v=21"></script>
    <script src="player.js?v=21"></script>
    <script src="network.js?v=21"></script>
    <script src="game.js?v=21"></script>
</body>

</html>
